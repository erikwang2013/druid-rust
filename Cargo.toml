[workspace]
resolver = "2"

members = [
    "druid-core",
    "druid-util",
    # 后续阶段
    "druid-sql",
    "druid-filter",
    "druid-wall",
    "druid-pool",
    "druid-stat",
    "druid-proxy",
    "druid-ha",
    "druid-console",
]

[workspace.package]
name="druid-rust"
version = "1.0.5"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/alibaba/druid"
authors = ["erik"]

[workspace.dependencies]
# 异步运行时
tokio = { version = "1", features = ["full"] }

# 数据库驱动
sqlx = { version = "0.8", features = ["runtime-tokio"] }

# HTTP 框架
axum = "0.7"

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 异步 trait
async-trait = "0.1"

# 错误处理
thiserror = "2"
anyhow = "1"

# 日志/追踪
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

# 指标
metrics = "0.24"

# 同步原语
parking_lot = "0.12"

# 配置
figment = { version = "0.10", features = ["toml", "yaml", "env"] }

# 测试
criterion = "0.5"
proptest = "1"

# 模板引擎（监控页面）
askama = "0.12"

# 工具
once_cell = "1"
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
