[workspace]
resolver = "2"

members = [
    "druid-core",
    "druid-util",
    # 后续阶段
    "druid-sql",
    "druid-filter",
    "druid-wall",
    "druid-pool",
    "druid-stat",
    "druid-proxy",
    "druid-ha",
    "druid-console",
]

[workspace.package]
version = "1.3.1"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/erikwang2013/druid-rust"
authors = ["erik"]

[workspace.dependencies]
# 内部 crate —— path 供本地开发，version 供 crates.io 发布
druid-core = { version = "1.3.1", path = "druid-core" }
druid-util = { version = "1.3.1", path = "druid-util" }
druid-sql = { version = "1.3.1", path = "druid-sql" }
druid-filter = { version = "1.3.1", path = "druid-filter" }
druid-wall = { version = "1.3.1", path = "druid-wall" }
druid-pool = { version = "1.3.1", path = "druid-pool" }
druid-stat = { version = "1.3.1", path = "druid-stat" }
druid-proxy = { version = "1.3.1", path = "druid-proxy" }
druid-ha = { version = "1.3.1", path = "druid-ha" }
druid-console = { version = "1.3.1", path = "druid-console" }

# 异步运行时
tokio = { version = "1", features = ["full"] }

# 数据库驱动

# HTTP 框架
axum = "0.7"

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 异步 trait
async-trait = "0.1"

# 错误处理
thiserror = "2"

# 日志/追踪
tracing = "0.1"

# 测试
criterion = "0.5"

# 工具
chrono = { version = "0.4", features = ["serde"] }
# zeroize feature：aes-gcm 侧清 GHASH 构造期的临时密钥，aes 侧给轮密钥加 ZeroizeOnDrop，
# 两者缺一 feature 都会被 #[cfg] 编译掉
aes-gcm = { version = "0.10", features = ["zeroize"] }
aes = { version = "0.8", features = ["zeroize"] }
zeroize = { version = "1", features = ["zeroize_derive"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
