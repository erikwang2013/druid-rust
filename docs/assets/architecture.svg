<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" role="img" aria-labelledby="drArchTitle drArchDesc">
  <title id="drArchTitle">Druid-Rust 架构设计</title>
  <desc id="drArchDesc">七层分层架构：从层 0 基础设施到层 6 控制台，依赖单向向下。</desc>

  <rect x="0" y="0" width="1000" height="620" rx="14" fill="#0b1b2b"/>
  <rect x="0.5" y="0.5" width="999" height="619" rx="13.5" fill="none" stroke="#1e3a5f"/>

  <text x="32" y="46" font-family="ui-sans-serif, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="700" fill="#e2e8f0">Druid-Rust 架构设计</text>
  <text x="32" y="70" font-family="ui-sans-serif, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#7c93a8">10 个 crate · 7 层 · 依赖单向向下 · 组合优于继承</text>

  <!-- 层 6 -->
  <rect x="24" y="88" width="952" height="52" rx="10" fill="#ffffff" fill-opacity=".025" stroke="#ffffff" stroke-opacity=".06"/>
  <rect x="24" y="88" width="4" height="52" rx="2" fill="#38bdf8"/>
  <text x="48" y="110" font-family="ui-sans-serif, 'PingFang SC', sans-serif" font-size="11" font-weight="700" fill="#38bdf8">层 6</text>
  <text x="48" y="126" font-family="ui-sans-serif, 'PingFang SC', sans-serif" font-size="10" fill="#64748b">控制台</text>
  <rect x="190" y="94" width="786" height="40" rx="8" fill="#38bdf8" fill-opacity=".1" stroke="#38bdf8" stroke-opacity=".45" stroke-width="1.2"/>
  <text x="206" y="110" font-family="ui-monospace, 'SFMono-Regular', monospace" font-size="13" font-weight="700" fill="#7dd3fc">druid-console</text>
  <text x="206" y="124" font-family="ui-sans-serif, 'PingFang SC', sans-serif" font-size="10" fill="#94a3b8">axum HTTP 监控页面 · /druid/stat.json · /druid/sql.json · /druid/slow-sql.json</text>

  <!-- 层 5 -->
  <rect x="24" y="160" width="952" height="52" rx="10" fill="#ffffff" fill-opacity=".025" stroke="#ffffff" stroke-opacity=".06"/>
  <rect x="24" y="160" width="4" height="52" rx="2" fill="#a78bfa"/>
  <text x="48" y="182" font-family="ui-sans-serif, 'PingFang SC', sans-serif" font-size="11" font-weight="700" fill="#a78bfa">层 5</text>
  <text x="48" y="198" font-family="ui-sans-serif, 'PingFang SC', sans-serif" font-size="10" fill="#64748b">高级特性</text>
  <rect x="190" y="166" width="380" height="40" rx="8" fill="#a78bfa" fill-opacity=".1" stroke="#a78bfa" stroke-opacity=".45" stroke-width="1.2"/>
  <text x="206" y="182" font-family="ui-monospace, 'SFMono-Regular', monospace" font-size="13" font-weight="700" fill="#c4b5fd">druid-ha</text>
  <text x="206" y="196" font-family="ui-sans-serif, 'PingFang SC', sans-serif" font-size="10" fill="#94a3b8">加权轮询 · 健康检查 · 故障切换</text>
  <rect x="586" y="166" width="390" height="40" rx="8" fill="#a78bfa" fill-opacity=".1" stroke="#a78bfa" stroke-opacity=".45" stroke-width="1.2"/>
  <text x="602" y="182" font-family="ui-monospace, 'SFMono-Regular', monospace" font-size="13" font-weight="700" fill="#c4b5fd">druid-proxy</text>
  <text x="602" y="196" font-family="ui-sans-serif, 'PingFang SC', sans-serif" font-size="10" fill="#94a3b8">ProxyConnection · ProxyStatement 拦截</text>

  <!-- 层 4 -->
  <rect x="24" y="232" width="952" height="52" rx="10" fill="#4ade80" fill-opacity=".05" stroke="#4ade80" stroke-opacity=".18"/>
  <rect x="24" y="232" width="4" height="52" rx="2" fill="#4ade80"/>
  <text x="48" y="254" font-family="ui-sans-serif, 'PingFang SC', sans-serif" font-size="11" font-weight="700" fill="#4ade80">层 4</text>
  <text x="48" y="270" font-family="ui-sans-serif, 'PingFang SC', sans-serif" font-size="10" fill="#64748b">连接池核心</text>
  <rect x="190" y="238" width="786" height="40" rx="8" fill="#4ade80" fill-opacity=".14" stroke="#4ade80" stroke-opacity=".6" stroke-width="1.4"/>
  <text x="206" y="254" font-family="ui-monospace, 'SFMono-Regular', monospace" font-size="13" font-weight="700" fill="#86efac">druid-pool</text>
  <text x="206" y="268" font-family="ui-sans-serif, 'PingFang SC', sans-serif" font-size="10" fill="#94a3b8">Semaphore 并发控制 · PoolGuard RAII 自动归还 · 空闲驱逐 · KeepAlive · PSCache</text>

  <!-- 层 3 -->
  <rect x="24" y="304" width="952" height="52" rx="10" fill="#ffffff" fill-opacity=".025" stroke="#ffffff" stroke-opacity=".06"/>
  <rect x="24" y="304" width="4" height="52" rx="2" fill="#fbbf24"/>
  <text x="48" y="326" font-family="ui-sans-serif, 'PingFang SC', sans-serif" font-size="11" font-weight="700" fill="#fbbf24">层 3</text>
  <text x="48" y="342" font-family="ui-sans-serif, 'PingFang SC', sans-serif" font-size="10" fill="#64748b">Filter 插件</text>
  <rect x="190" y="310" width="380" height="40" rx="8" fill="#fbbf24" fill-opacity=".1" stroke="#fbbf24" stroke-opacity=".45" stroke-width="1.2"/>
  <text x="206" y="326" font-family="ui-monospace, 'SFMono-Regular', monospace" font-size="13" font-weight="700" fill="#fcd34d">druid-wall</text>
  <text x="206" y="340" font-family="ui-sans-serif, 'PingFang SC', sans-serif" font-size="10" fill="#94a3b8">13 项安全检查 · LRU 检查缓存</text>
  <rect x="586" y="310" width="390" height="40" rx="8" fill="#fbbf24" fill-opacity=".1" stroke="#fbbf24" stroke-opacity=".45" stroke-width="1.2"/>
  <text x="602" y="326" font-family="ui-monospace, 'SFMono-Regular', monospace" font-size="13" font-weight="700" fill="#fcd34d">druid-stat</text>
  <text x="602" y="340" font-family="ui-sans-serif, 'PingFang SC', sans-serif" font-size="10" fill="#94a3b8">SQL 统计 · 慢 SQL 告警 · PoolMetrics</text>

  <!-- 层 2 -->
  <rect x="24" y="376" width="952" height="52" rx="10" fill="#ffffff" fill-opacity=".025" stroke="#ffffff" stroke-opacity=".06"/>
  <rect x="24" y="376" width="4" height="52" rx="2" fill="#f472b6"/>
  <text x="48" y="398" font-family="ui-sans-serif, 'PingFang SC', sans-serif" font-size="11" font-weight="700" fill="#f472b6">层 2</text>
  <text x="48" y="414" font-family="ui-sans-serif, 'PingFang SC', sans-serif" font-size="10" fill="#64748b">可插拔架构</text>
  <rect x="190" y="382" width="786" height="40" rx="8" fill="#f472b6" fill-opacity=".1" stroke="#f472b6" stroke-opacity=".45" stroke-width="1.2"/>
  <text x="206" y="398" font-family="ui-monospace, 'SFMono-Regular', monospace" font-size="13" font-weight="700" fill="#f9a8d4">druid-filter</text>
  <text x="206" y="412" font-family="ui-sans-serif, 'PingFang SC', sans-serif" font-size="10" fill="#94a3b8">Filter trait 20+ 生命周期钩子 · FilterAdapter 空实现 · FilterChain 责任链</text>

  <!-- 层 1 -->
  <rect x="24" y="448" width="952" height="52" rx="10" fill="#ffffff" fill-opacity=".025" stroke="#ffffff" stroke-opacity=".06"/>
  <rect x="24" y="448" width="4" height="52" rx="2" fill="#22d3ee"/>
  <text x="48" y="470" font-family="ui-sans-serif, 'PingFang SC', sans-serif" font-size="11" font-weight="700" fill="#22d3ee">层 1</text>
  <text x="48" y="486" font-family="ui-sans-serif, 'PingFang SC', sans-serif" font-size="10" fill="#64748b">解析引擎</text>
  <rect x="190" y="454" width="786" height="40" rx="8" fill="#22d3ee" fill-opacity=".1" stroke="#22d3ee" stroke-opacity=".45" stroke-width="1.2"/>
  <text x="206" y="470" font-family="ui-monospace, 'SFMono-Regular', monospace" font-size="13" font-weight="700" fill="#67e8f9">druid-sql</text>
  <text x="206" y="484" font-family="ui-sans-serif, 'PingFang SC', sans-serif" font-size="10" fill="#94a3b8">Lexer 80+ Token · 递归下降 Parser · AST 30 种表达式 · 30 种方言 · Visitor</text>

  <!-- 层 0 -->
  <rect x="24" y="520" width="952" height="52" rx="10" fill="#ffffff" fill-opacity=".025" stroke="#ffffff" stroke-opacity=".06"/>
  <rect x="24" y="520" width="4" height="52" rx="2" fill="#94a3b8"/>
  <text x="48" y="542" font-family="ui-sans-serif, 'PingFang SC', sans-serif" font-size="11" font-weight="700" fill="#94a3b8">层 0</text>
  <text x="48" y="558" font-family="ui-sans-serif, 'PingFang SC', sans-serif" font-size="10" fill="#64748b">基础设施</text>
  <rect x="190" y="526" width="380" height="40" rx="8" fill="#94a3b8" fill-opacity=".1" stroke="#94a3b8" stroke-opacity=".45" stroke-width="1.2"/>
  <text x="206" y="542" font-family="ui-monospace, 'SFMono-Regular', monospace" font-size="13" font-weight="700" fill="#cbd5e1">druid-core</text>
  <text x="206" y="556" font-family="ui-sans-serif, 'PingFang SC', sans-serif" font-size="10" fill="#94a3b8">DruidError · DbType (30 方言) · DruidConfig</text>
  <rect x="586" y="526" width="390" height="40" rx="8" fill="#94a3b8" fill-opacity=".1" stroke="#94a3b8" stroke-opacity=".45" stroke-width="1.2"/>
  <text x="602" y="542" font-family="ui-monospace, 'SFMono-Regular', monospace" font-size="13" font-weight="700" fill="#cbd5e1">druid-util</text>
  <text x="602" y="556" font-family="ui-sans-serif, 'PingFang SC', sans-serif" font-size="10" fill="#94a3b8">SQL 检测 · 字符串 · AES-256-GCM · 时间</text>

  <!-- 依赖方向指示 -->
  <g fill="none" stroke="#2f4f6f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M430 145 l7 8 l7 -8"/>
    <path d="M700 145 l7 8 l7 -8"/>
    <path d="M430 217 l7 8 l7 -8"/>
    <path d="M700 217 l7 8 l7 -8"/>
    <path d="M430 289 l7 8 l7 -8"/>
    <path d="M700 289 l7 8 l7 -8"/>
    <path d="M430 361 l7 8 l7 -8"/>
    <path d="M700 361 l7 8 l7 -8"/>
    <path d="M430 433 l7 8 l7 -8"/>
    <path d="M700 433 l7 8 l7 -8"/>
    <path d="M430 505 l7 8 l7 -8"/>
    <path d="M700 505 l7 8 l7 -8"/>
  </g>
</svg>
