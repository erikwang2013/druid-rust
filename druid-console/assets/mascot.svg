<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" role="img" aria-labelledby="drMascotTitle drMascotDesc">
  <title id="drMascotTitle">Druid-Rust 项目宠物 · 德鲁伊猫头鹰「小德」</title>
  <desc id="drMascotDesc">一只头戴德鲁伊兜帽的猫头鹰，守护着由数据库连接组成的连接池。</desc>
  <defs>
    <radialGradient id="drBadge" cx="50%" cy="36%" r="74%">
      <stop offset="0" stop-color="#17384f"/>
      <stop offset="1" stop-color="#0a1725"/>
    </radialGradient>
    <linearGradient id="drOwl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd894"/>
      <stop offset="1" stop-color="#e09b3d"/>
    </linearGradient>
    <linearGradient id="drHood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="drPool" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f5f88"/>
      <stop offset="1" stop-color="#0e2438"/>
    </linearGradient>
  </defs>

  <!-- 徽章底 -->
  <circle cx="80" cy="80" r="76" fill="url(#drBadge)"/>
  <circle cx="80" cy="80" r="74" fill="none" stroke="#34d399" stroke-opacity=".4" stroke-width="1.5"/>

  <!-- 连接池：三层数据库叠盘 -->
  <path d="M40 120 L40 140 A40 9 0 0 0 120 140 L120 120 Z" fill="url(#drPool)"/>
  <ellipse cx="80" cy="120" rx="40" ry="9" fill="#3a90c0"/>
  <ellipse cx="80" cy="120" rx="32" ry="6.4" fill="#123f5e"/>
  <ellipse cx="80" cy="121" rx="26" ry="5" fill="none" stroke="#7dd3fc" stroke-opacity=".45" stroke-width="1.2"/>
  <ellipse cx="80" cy="121" rx="14" ry="2.8" fill="none" stroke="#7dd3fc" stroke-opacity=".3" stroke-width="1.2"/>
  <g fill="#7dd3fc" fill-opacity=".85">
    <circle cx="120" cy="120" r="2.6"/>
    <circle cx="110.6" cy="125.8" r="2.6"/>
    <circle cx="80" cy="129" r="2.6"/>
    <circle cx="49.4" cy="125.8" r="2.6"/>
    <circle cx="40" cy="120" r="2.6"/>
  </g>

  <!-- 猫头鹰身体 -->
  <ellipse cx="80" cy="86" rx="30" ry="34" fill="url(#drOwl)"/>
  <ellipse cx="80" cy="98" rx="18" ry="16" fill="#fff3d6" fill-opacity=".45"/>
  <path d="M55 76 C 44 84 44 102 55 110 C 59 96 59 86 55 76 Z" fill="#cf8a2e"/>
  <path d="M105 76 C 116 84 116 102 105 110 C 101 96 101 86 105 76 Z" fill="#cf8a2e"/>

  <!-- 爪 -->
  <g stroke="#f59e0b" stroke-width="2.4" stroke-linecap="round" fill="none">
    <path d="M70 112 L67 122"/>
    <path d="M74 113 L73 124"/>
    <path d="M78 113 L79 123"/>
    <path d="M82 113 L81 123"/>
    <path d="M86 113 L87 124"/>
    <path d="M90 112 L93 122"/>
  </g>

  <!-- 面部：大眼 + 喙 -->
  <circle cx="70" cy="80" r="11" fill="#fffdf7"/>
  <circle cx="90" cy="80" r="11" fill="#fffdf7"/>
  <circle cx="70" cy="80" r="5.5" fill="#12263a"/>
  <circle cx="90" cy="80" r="5.5" fill="#12263a"/>
  <circle cx="72" cy="77.5" r="2" fill="#ffffff"/>
  <circle cx="92" cy="77.5" r="2" fill="#ffffff"/>
  <path d="M80 84 L75 94 L85 94 Z" fill="#f59e0b"/>

  <!-- 德鲁伊兜帽 -->
  <path d="M80 36 C 105 36 118 56 110 94 C 107 72 97 58 80 58 C 63 58 53 72 50 94 C 42 56 55 36 80 36 Z" fill="url(#drHood)"/>
  <path d="M80 36 C 105 36 118 56 110 94" fill="none" stroke="#86efac" stroke-opacity=".5" stroke-width="1.4"/>
  <path d="M80 36 C 80 28 83 24 88 20" stroke="#4ade80" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M88 20 C 97 14 105 18 102 27 C 94 32 86 28 88 20 Z" fill="#86efac"/>
</svg>
