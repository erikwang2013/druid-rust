[package]
name = "druid-pool"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "../README.md"
description = "Async connection pool for Druid-Rust — semaphore-based, eviction, KeepAlive, PSCache"
keywords = ["druid", "connection-pool", "database", "async"]
categories = ["database"]

[dependencies]
druid-core.workspace = true
druid-filter.workspace = true
druid-stat.workspace = true
tokio = { workspace = true, features = ["sync", "time", "rt"] }
tracing.workspace = true
async-trait.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
criterion.workspace = true
async-trait.workspace = true

[[bench]]
name = "pool_bench"
harness = false
