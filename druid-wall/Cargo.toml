[package]
name = "druid-wall"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "../README.md"
description = "SQL firewall for Druid-Rust — AST-level security checks, deny functions/operations"
keywords = ["druid", "sql", "firewall", "security"]
categories = ["database"]
[dependencies]
druid-core.workspace = true
druid-sql.workspace = true
druid-filter.workspace = true
serde.workspace = true
tracing.workspace = true
thiserror.workspace = true

# 对抗验证需要走真实的「数据源 → Filter 链 → 驱动」路径，
# 否则只能验证 checker 本身，无法证明墙挡在驱动之前。
[dev-dependencies]
druid-pool.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
async-trait.workspace = true
