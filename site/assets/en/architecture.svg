  <text x="48" y="342" font-family="ui-sans-serif, 'PingFang SC', sans-serif" font-size="10" fill="#64748b">Filter plugins</text>
  <rect x="190" y="310" width="380" height="40" rx="8" fill="#fbbf24" fill-opacity=".1" stroke="#fbbf24" stroke-opacity=".45" stroke-width="1.2"/>
  <text x="206" y="326" font-family="ui-monospace, 'SFMono-Regular', monospace" font-size="13" font-weight="700" fill="#fcd34d">druid-wall</text>
  <text x="206" y="340" font-family="ui-sans-serif, 'PingFang SC', sans-serif" font-size="10" fill="#94a3b8">13 security checks · LRU check cache</text>
  <rect x="586" y="310" width="390" height="40" rx="8" fill="#fbbf24" fill-opacity=".1" stroke="#fbbf24" stroke-opacity=".45" stroke-width="1.2"/>
  <text x="602" y="326" font-family="ui-monospace, 'SFMono-Regular', monospace" font-size="13" font-weight="700" fill="#fcd34d">druid-stat</text>
  <text x="602" y="340" font-family="ui-sans-serif, 'PingFang SC', sans-serif" font-size="10" fill="#94a3b8">SQL stats · slow SQL alerts · PoolMetrics</text>

  <!-- Layer 2 -->
  <rect x="24" y="376" width="952" height="52" rx="10" fill="#ffffff" fill-opacity=".025" stroke="#ffffff" stroke-opacity=".06"/>
  <rect x="24" y="376" width="4" height="52" rx="2" fill="#f472b6"/>
