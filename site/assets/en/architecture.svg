  <text x="48" y="270" font-family="ui-sans-serif, 'PingFang SC', sans-serif" font-size="10" fill="#64748b">Pool core</text>
  <rect x="190" y="238" width="786" height="40" rx="8" fill="#4ade80" fill-opacity=".14" stroke="#4ade80" stroke-opacity=".6" stroke-width="1.4"/>
