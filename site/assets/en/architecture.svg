  <text x="48" y="414" font-family="ui-sans-serif, 'PingFang SC', sans-serif" font-size="10" fill="#64748b">Pluggable</text>
  <rect x="190" y="382" width="786" height="40" rx="8" fill="#f472b6" fill-opacity=".1" stroke="#f472b6" stroke-opacity=".45" stroke-width="1.2"/>
  <text x="206" y="398" font-family="ui-monospace, 'SFMono-Regular', monospace" font-size="13" font-weight="700" fill="#f9a8d4">druid-filter</text>
  <text x="206" y="412" font-family="ui-sans-serif, 'PingFang SC', sans-serif" font-size="10" fill="#94a3b8">Filter trait 20+ hooks · FilterAdapter no-op · FilterChain</text>

  <!-- Layer 1 -->
  <rect x="24" y="448" width="952" height="52" rx="10" fill="#ffffff" fill-opacity=".025" stroke="#ffffff" stroke-opacity=".06"/>
  <rect x="24" y="448" width="4" height="52" rx="2" fill="#22d3ee"/>
  <text x="48" y="470" font-family="ui-sans-serif, 'PingFang SC', sans-serif" font-size="11" font-weight="700" fill="#22d3ee">Layer 1</text>
  <text x="48" y="486" font-family="ui-sans-serif, 'PingFang SC', sans-serif" font-size="10" fill="#64748b">Parser</text>
  <rect x="190" y="454" width="786" height="40" rx="8" fill="#22d3ee" fill-opacity=".1" stroke="#22d3ee" stroke-opacity=".45" stroke-width="1.2"/>
  <text x="206" y="470" font-family="ui-monospace, 'SFMono-Regular', monospace" font-size="13" font-weight="700" fill="#67e8f9">druid-sql</text>
  <text x="206" y="484" font-family="ui-sans-serif, 'PingFang SC', sans-serif" font-size="10" fill="#94a3b8">Lexer 80+ tokens · recursive-descent parser · 30 expressions · 30 dialects · Visitor</text>

  <!-- Layer 0 -->
  <rect x="24" y="520" width="952" height="52" rx="10" fill="#ffffff" fill-opacity=".025" stroke="#ffffff" stroke-opacity=".06"/>
  <rect x="24" y="520" width="4" height="52" rx="2" fill="#94a3b8"/>
  <text x="48" y="542" font-family="ui-sans-serif, 'PingFang SC', sans-serif" font-size="11" font-weight="700" fill="#94a3b8">Layer 0</text>
  <text x="48" y="558" font-family="ui-sans-serif, 'PingFang SC', sans-serif" font-size="10" fill="#64748b">Foundation</text>
  <rect x="190" y="526" width="380" height="40" rx="8" fill="#94a3b8" fill-opacity=".1" stroke="#94a3b8" stroke-opacity=".45" stroke-width="1.2"/>
  <text x="206" y="542" font-family="ui-monospace, 'SFMono-Regular', monospace" font-size="13" font-weight="700" fill="#cbd5e1">druid-core</text>
  <text x="206" y="556" font-family="ui-sans-serif, 'PingFang SC', sans-serif" font-size="10" fill="#94a3b8">DruidError · DbType (30 dialects) · DruidConfig</text>
  <rect x="586" y="526" width="390" height="40" rx="8" fill="#94a3b8" fill-opacity=".1" stroke="#94a3b8" stroke-opacity=".45" stroke-width="1.2"/>
  <text x="602" y="542" font-family="ui-monospace, 'SFMono-Regular', monospace" font-size="13" font-weight="700" fill="#cbd5e1">druid-util</text>
  <text x="602" y="556" font-family="ui-sans-serif, 'PingFang SC', sans-serif" font-size="10" fill="#94a3b8">SQL detection · strings · AES-256-GCM · time</text>

